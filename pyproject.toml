[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stark"
version = "0.1.0"
description = "Stark — on-device voice assistant for macOS (Apple Silicon)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Audio I/O
    "sounddevice>=0.5.1",
    "numpy>=1.26",
    # VAD
    "silero-vad>=5.1.2",
    # STT
    "mlx-whisper>=0.4.1",
    # LLM
    "mlx-lm>=0.22.0",
    # TTS
    "kokoro-onnx>=0.4.8",
    "soundfile>=0.12",
    # macOS context
    "pyobjc-framework-ApplicationServices>=11.0",
    "pyobjc-framework-Cocoa>=11.0",
    # Config & CLI
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
    "typer>=0.15",
    "rich>=13.0",
]

[project.scripts]
stark = "stark.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/stark"]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
